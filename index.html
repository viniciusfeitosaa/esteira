<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f0c" />
  <title>Esteira — Contagem de grãos</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="top-bar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1>Esteira</h1>
      </div>
      <p class="status" id="statusText">Câmera desligada</p>
    </header>

    <main class="stage">
      <div class="viewport" id="viewport">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="overlay" aria-hidden="true"></canvas>
        <canvas id="process" class="offscreen" aria-hidden="true"></canvas>
        <div class="viewport-hint" id="viewportHint">
          Toque em <strong>Iniciar câmera</strong> e aponte para a esteira preta com grãos claros.
        </div>
      </div>

      <aside class="hud">
        <div class="counter-block">
          <span class="counter-label">Total contado</span>
          <span class="counter-value" id="countValue">0</span>
        </div>
        <div class="metrics">
          <div>
            <span class="metric-label">Na área</span>
            <span class="metric-value" id="visibleValue">0</span>
          </div>
          <div>
            <span class="metric-label">FPS</span>
            <span class="metric-value" id="fpsValue">—</span>
          </div>
        </div>
        <div class="actions">
          <button type="button" class="btn primary" id="btnStart">Iniciar câmera</button>
          <button type="button" class="btn" id="btnPause" disabled>Pausar contagem</button>
          <button type="button" class="btn danger" id="btnReset" disabled>Zerar</button>
        </div>
      </aside>
    </main>

    <section class="panel" id="panel">
      <button type="button" class="panel-toggle" id="btnTogglePanel" aria-expanded="false">
        Calibrar
        <span class="chevron" aria-hidden="true"></span>
      </button>
      <div class="panel-body" id="panelBody" hidden>
        <label class="field">
          <span>Limiar de brilho <em id="thresholdLabel">140</em></span>
          <input type="range" id="threshold" min="20" max="250" value="140" />
        </label>
        <label class="field">
          <span>Área mínima (px) <em id="minAreaLabel">40</em></span>
          <input type="range" id="minArea" min="5" max="800" value="40" />
        </label>
        <label class="field">
          <span>Área máxima (px) <em id="maxAreaLabel">4000</em></span>
          <input type="range" id="maxArea" min="100" max="20000" value="4000" />
        </label>
        <label class="field">
          <span>Posição da linha (%) <em id="linePosLabel">50</em></span>
          <input type="range" id="linePos" min="10" max="90" value="50" />
        </label>
        <label class="field">
          <span>Sensibilidade de match <em id="matchDistLabel">28</em></span>
          <input type="range" id="matchDist" min="10" max="80" value="28" />
        </label>
        <div class="field row">
          <label class="check">
            <input type="checkbox" id="invert" />
            Inverter limiar (grão escuro)
          </label>
          <label class="check">
            <input type="checkbox" id="showMask" />
            Ver máscara
          </label>
        </div>
        <label class="field">
          <span>Direção da esteira</span>
          <select id="direction">
            <option value="ltr">Esquerda → direita</option>
            <option value="rtl">Direita → esquerda</option>
            <option value="ttb">Cima → baixo</option>
            <option value="btt">Baixo → cima</option>
          </select>
        </label>
        <p class="tip">
          Dica: a esteira deve ficar bem preta e os grãos bem claros. Ajuste o limiar até só os grãos
          aparecerem na máscara. A linha virtual deve cortar o fluxo dos grãos.
        </p>
      </div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
